name: Italy Flight Radar
on:
  schedule:
    - cron: '0 0,4,10,15 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'radar.py'
      - 'config.json'
      - 'test_radar.py'
      - 'notify.py'
      - '.github/workflows/flight-radar.yml'
permissions:
  contents: write
  issues: write
concurrency:
  group: italy-flight-radar
  cancel-in-progress: false
jobs:
  radar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test quota and flight validation (no network)
        run: python -m unittest -v test_radar.py
      - name: Configure durable state commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run free-only flight monitor
        env:
          APISH_API_KEY: ${{ secrets.APISH_API_KEY }}
        run: python radar.py
      - name: Send and verify GitHub Issue alerts
        if: ${{ always() && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python notify.py
